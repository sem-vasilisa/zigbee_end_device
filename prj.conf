CONFIG_ZIGBEE_ROLE_END_DEVICE=y
CONFIG_ZIGBEE_ADD_ON=y
CONFIG_ZIGBEE_APP_UTILS=y

# Low power
# CONFIG_PM nie jest dostępne dla nRF54L15 (SoC nie robi "select HAS_PM" w NCS v3.4)
# CONFIG_PM=y
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y          # i2c30 ma zephyr,pm-device-runtime-auto
CONFIG_RAM_POWER_DOWN_LIBRARY=y
CONFIG_SERIAL=n

# Logowanie przez SEGGER RTT (UART wyłączony)
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_CONSOLE=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n

# Czujniki
CONFIG_I2C=y
CONFIG_SENSOR=y
# BMI270 nieużywany w tej aplikacji
# CONFIG_BMI270=y
# CONFIG_BMI270_TRIGGER_GLOBAL_THREAD=y

# Regulator szyny czujników
CONFIG_REGULATOR=y
CONFIG_REGULATOR_FIXED=y

# NRF_PLATFORM_LUMOS jest ustawiane przez NCS dla każdego nRF54L i jest deprecated;
# bez tego ostrzeżenie deprecacji przerywa konfigurację
CONFIG_WARN_DEPRECATED=n

CONFIG_NET_IPV6=n
CONFIG_NET_IP_ADDR_CHECK=n
CONFIG_NET_UDP=n

# do pomiarów prądu — patrz snippet low_power w samplu light_switch
# CONFIG_SERIAL=n
# CONFIG_CONSOLE=n
# CONFIG_LOG=n