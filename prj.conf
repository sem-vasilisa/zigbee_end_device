CONFIG_ZIGBEE_ROLE_END_DEVICE=y
CONFIG_ZIGBEE_ADD_ON=y
CONFIG_ZIGBEE_APP_UTILS=y

# Low power
CONFIG_PM=y
CONFIG_PM_DEVICE=y
# CONFIG_PM_DEVICE_RUNTIME=y          # i2c30 ma zephyr,pm-device-runtime-auto
CONFIG_RAM_POWER_DOWN_LIBRARY=y
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y

# Czujniki
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_BMI270=y
# CONFIG_BMI270_TRIGGER_GLOBAL_THREAD=y

# Regulator szyny czujników
CONFIG_REGULATOR=y
CONFIG_REGULATOR_FIXED=y

CONFIG_NET_IPV6=n
CONFIG_NET_IP_ADDR_CHECK=n
CONFIG_NET_UDP=n

# do pomiarów prądu — patrz snippet low_power w samplu light_switch
# CONFIG_SERIAL=n
# CONFIG_CONSOLE=n
# CONFIG_LOG=n

CONFIG_LOG_BUFFER_SIZE=4096

# main() was overflowing its default 2048B stack once immediate-mode
# logging + DBG-level I2C/sensor traces were enabled, causing a silent
# reset right after the sts4x i2c_read_dt() call.
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_STACK_SENTINEL=y